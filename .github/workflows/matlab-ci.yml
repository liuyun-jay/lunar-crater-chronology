# MATLAB static checks and synthetic end-to-end test.
# The full LU1319373 catalog is external and is not downloaded by CI.
name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Static check and synthetic test (R2025a)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2025a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025a

      - name: Static check gate
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('tools');
            lint_all('code', 'lint-report.txt');

      - name: Synthetic end-to-end test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            run('code/test_synthetic.m');

      - name: Upload lint report and test figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-artifacts
          path: |
            lint-report.txt
            figures/_test/*.png
          if-no-files-found: warn
